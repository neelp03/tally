services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tally_owner
      POSTGRES_PASSWORD: tally_owner
      POSTGRES_DB: tally
    ports:
      - "5433:5432"
    volumes:
      - tally-db:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally_owner -d tally"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tally-db:
