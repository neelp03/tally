services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tally_owner
      POSTGRES_PASSWORD: tally_owner
      POSTGRES_DB: tally
    ports:
      - "5433:5432"
    volumes:
      - tally-db:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally_owner -d tally"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The full app. For development, start only the database: docker compose up -d db
  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://tally_owner:tally_owner@db:5432/tally
      APP_DATABASE_URL: postgres://tally_app:tally_app@db:5432/tally
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      PUBLIC_URL: http://localhost:3002
      DEMO_MODE: "true"

volumes:
  tally-db:
